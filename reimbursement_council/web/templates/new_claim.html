{% extends "base.html" %}
{% block content %}
<form class="card" method="post" action="/claims" enctype="multipart/form-data">
  <h2>{{ t.nav_claim }}</h2>
  <input type="hidden" name="lang" value="{{ lang }}">
  <label for="patient">{{ t.who }}
    <select id="patient" name="patient">
      {% for person in people %}<option value="{{ person.member_id }}"{% if person.member_id == selected %} selected{% endif %}>{{ person.display_name }}</option>{% endfor %}
    </select>
  </label>
  <p class="note"><a href="/members/new?lang={{ lang }}">{{ t.member_add_link }}</a></p>
  <label for="photos">{{ t.photos }}
    <input id="photos" type="file" name="photos" accept="image/png,image/jpeg,application/pdf" multiple>
  </label>
  <label class="consent" for="consent">
    <input id="consent" type="checkbox" name="consent" value="yes" required>
    <span>{{ t.consent }}</span>
  </label>
  <div class="btns"><button class="btn primary" type="submit">{{ t.send }}</button></div>
  <p class="note">{{ t.reading_note }}</p>
  <h2>{{ t.demo_title }}</h2>
  <div class="btns">
    {% for name in demos %}<button class="btn" type="submit" name="demo" value="{{ name }}">{{ t['demo_' ~ name] }}</button>{% endfor %}
  </div>
  <h2>{{ t.or_sample }}</h2>
  <div class="samples">
    {% for name in samples %}
    <button type="submit" name="sample" value="{{ name }}"><img src="/samples/{{ name }}.png" alt="">{{ name.replace('_', ' ') }}</button>
    {% endfor %}
  </div>
</form>
{% endblock %}
