# Every weight, threshold, cost and switch for deciding a claim. Starting values, tuned on synthetic_tune.
# Money in halalas. Scores and limits from 0 to 1.
hard_rule_confidence_floor: 0.90
disagreement_limit: 0.25
reviewer_time_value_halalas: 2500
qr_first_enabled: true
arithmetic_checks_enabled: true
arithmetic_tolerance_halalas: 1
failed_check_confidence_factor: 0.5
partial_payout_tolerance_halalas: 100
calibration_enabled: true
calibration_method: platt
disagreement_routing_enabled: true
cost_lanes_enabled: true
fixed_p_good_threshold: 0.90
always_review_amount_enabled: false
always_review_amount_halalas: 500000
self_fix_enabled: true
self_fix_max_retries: 2
self_fix_p_good_limit: 0.6
# a claim counts as paid right when within this of the correct payout (main spec section 11)
paid_right_tolerance_halalas: 100
gemini_reader_enabled: false
# reader for images: easyocr (QR plus OCR text) or qr_only (QR codes only, no OCR install needed)
reader: ollama
# The local model reader (reader: ollama; docs/MODEL_SAFETY.md). It only reads. Every value it
# returns must pass the checks in core/vision_checks.py or it is dropped.
vision:
  field_confidence: 0.85      # a value only the model read (checks passed): under the 0.90 floor,
                              # so a rule field needs EasyOCR to agree, the QR or the arithmetic
  agree_confidence: 0.97      # the model and EasyOCR read the same value (two readers)
  disagree_confidence: 0.60   # they read different values: under the floor, the member is asked
  ground_ratio: 0.8           # how close a name must be to the OCR text to count as printed
  vat_number_pattern: "^3[0-9]{13}3$"  # 15 digits, first and last 3 (CHECK in HANDOVER)
  # Read with the model and EasyOCR at the same time. Only when EasyOCR is on the CPU: on one
  # 12 GB GPU the two ran out of memory together (core day 4b).
  parallel_ocr: false
  # A photo on its side: when a reading has fewer sure fields plus items than this, the reader
  # also tries the photo turned 90, 180 and 270 degrees and keeps the strongest (web/final).
  rotation_retry: true
  rotation_strong_below: 3
  # A name on a row with one of these words is staff, not the patient (core day 4b: the model
  # took the salesperson on optical invoices for the patient).
  staff_words: ["موظف البيع", "البائع", "الكاشير", "الصيدلي", "salesperson", "sales person", "cashier", "pharmacist", "served by"]
  # The model's item type for a line whose name matches no service (a brand name on an optical
  # invoice). The item then gets the disagree confidence: under the floor, a person sees it.
  item_type_services: {frame: OPT-FRAME, lenses: OPT-LENS, eye_test: OPT-EXAM}
  future_days: 1              # a date more than this many days after the upload is implausible
# E (two readers): EasyOCR and the model agreeing raises a field's confidence, disagreeing
# lowers it and asks the member. Only used with reader: ollama.
two_readers_enabled: true
# E12: compare patient, date and provider across the documents of a claim.
cross_checks_enabled: true
# when every arithmetic check passes, the money fields and items involved are corroborated
passed_check_confidence: 0.95
# One-tap date confirm (core day 4): a confirmed date with no other evidence counts with this
# confidence (just above the 0.90 floor), unless the claim is within confirm_date_margin_days of
# the claim window limit or past it; then a person checks it.
member_confirmed_confidence: 0.92
confirm_date_margin_days: 7
ocr:
  label_match_ratio: 0.8      # how close an OCR word must be to a label word (0 to 1)
  alias_match_ratio: 0.8      # how close an OCR word must be to a service name word
  pattern_miss_factor: 0.5    # confidence multiplier when a value needed fixing or does not add up
  heuristic_factor: 0.9       # confidence multiplier for values found by position, not by label
  use_gpu: true              # EasyOCR on the GPU when PyTorch has CUDA (falls back to the CPU)
  row_overlap: 0.5            # share of line height two boxes may differ by and still be one row
  min_date_year: 2000         # a date outside these years is not a treatment date (a Hijri
  max_date_year: 2099         # 1448 or an id like 8-12-1234 is left out; data review, day 4)
members:
  document_checker: {enabled: true, weight: 1.0, required_fields: [provider_name, treatment_date, total], failed_check_score_cap: 0.5}
  coverage_checker: {enabled: true, weight: 1.0, no_items_score: 0.3}
  price_checker: {enabled: true, weight: 1.0, zero_score_ratio: 3.0, unknown_item_score: 0.5}
  # provider_trust_weight: share of the score from provider trust; the rest is member history
  history_member: {enabled: true, weight: 1.0, min_past_claims: 3, provider_trust_weight: 0.5}
  # The AI case reviewer: a local model reads a summary of the case and gives one score.
  # It can only send a claim that would be auto approved to a person (decision 010).
  case_reviewer:
    # On (core day 4b): held-out golden score 0.95 (limit 0.90, tests/golden_v2/heldout) and
    # 0 wrong approvals with it on, on the synthetic check set (EXPERIMENTS, Step 4d).
    enabled: true
    weight: 1.0
    timeout_seconds: 10           # live path: a slower answer is skipped, the council decides alone
    check_timeout_seconds: 120    # golden check: the first call may load the model
    review_lanes: [auto_approve, human_review]  # lanes (without the reviewer) it is asked about
    score_floor: 0.3              # a reviewer score below this sends an approve to a person
    disagreement_gap: 0.4         # the others' score minus the reviewer's above this: a person
    min_cited_fields: 1           # an answer must point at this many read fields
    max_reason_characters: 300
    golden_good_min_score: 0.6    # a golden good claim passes at or above this score
    golden_bad_max_score: 0.4     # a golden bad claim passes at or below this score
    golden_pass_rate: 0.9         # share of the golden set that must pass, or it is benched
    monitor_window: 50            # the last N answers the monitors look at
    monitor_min_votes: 10         # monitors judge only after this many answers
    max_discarded_rate: 0.2       # more discarded answers than this share benches it
    min_score_spread: 0.02        # a standard deviation of scores below this benches it
