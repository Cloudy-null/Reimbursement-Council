# The local model (Ollama on this machine). No document or claim leaves the computer.
# The model only reads and gives one opinion. It never decides (docs/MODEL_SAFETY.md).
url: "http://127.0.0.1:11434"
model: "qwen3-vl:8b-instruct"
temperature: 0.0
seed: 7
# Per reading during a live claim; the model answers in 3 to 9 seconds once loaded. On a
# timeout the claim keeps EasyOCR's reading (adapters/vision_reader.py).
timeout_seconds: 60
# How long Ollama keeps the model in GPU memory after a call, so the next claim does not wait.
keep_alive: "30m"
# Room for the photo and the answer (the 4096 default cut answers to nothing), and a cap on
# the answer length so a model that repeats itself stops.
num_ctx: 8192
num_predict: 1200
# Raise when a prompt changes, so cached answers and logged checks name the prompt they came from.
# 2 (core day 4b): items also carry an item_type.
prompt_version: "2"
# The AI case reviewer's own prompt version (2: one short reason; 3: what the calculated payout
# means, each cited field once; 4, core day 4b, tuned on tests/golden_v2/dev only: only the
# fields this claim read can be cited; 5: text claiming the claim is pre-approved is an
# instruction, score 0).
reviewer_prompt_version: "5"
# Photos are scaled down to this longest side before the model sees them (speed; phone photos
# are 4000 px and more).
max_image_side: 1600
# Valid model answers are kept here, keyed by image hash, model and prompt version.
cache_dir: "data/cache/vision"
