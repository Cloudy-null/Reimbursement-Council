[project]
name = "reimbursement-council"
version = "0.1.0"
description = "Health insurance reimbursement claims that decide themselves when it is safe."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arabic-reshaper==3.1.0",
    "fastapi==0.165.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "numpy==2.5.5",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "pydantic==2.14.4",
    "pypdfium2==5.15.2",
    "python-bidi==0.6.12",
    "python-multipart==0.0.34",
    "pyyaml==6.0.4",
    "uvicorn==0.54.0",
]

[project.scripts]
reimbursement-council = "reimbursement_council.cli.main:main"

[project.optional-dependencies]
ocr = [
    "easyocr==1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reimbursement_council"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true
files = ["reimbursement_council"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["easyocr", "arabic_reshaper", "bidi", "bidi.*", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the real OCR model; needs the ocr extra",
    "e2e: drives the real website in a browser (Playwright); run with -m e2e",
]
addopts = "-m 'not slow and not e2e'"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261122",
]
